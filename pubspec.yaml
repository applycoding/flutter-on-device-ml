name: flutter_on_device_ml
description: On-device object detection and text recognition. A portfolio demo.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  tflite_flutter: ^0.12.1
  google_mlkit_text_recognition: ^0.17.1
  image_picker: ^1.2.4
  image: ^4.12.0
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  path: ^1.9.1
  sqlite3_flutter_libs: ^0.6.0+eol

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

flutter:
  uses-material-design: true
  assets:
    - assets/models/model_config.json
    - assets/models/labelmap_ssd_mobilenet_v1.txt
    # Add this line only after you download a model. The file is gitignored.
    # - assets/models/detect.tflite
